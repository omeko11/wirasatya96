version: '3.8'

services:
  # ============================================================================
  # 1. FRONTEND: Next.js 14 Bareskrim Crimson Red Web Portal
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: wirasatya96-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - wirasatya-net

  # ============================================================================
  # 2. BACKEND: Express REST API & MinIO S3 / PostgreSQL Connector
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    container_name: wirasatya96-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change_me_jwt_secret}
      # Database Connection
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-change_me_db_password}
      - DB_NAME=${DB_NAME:-wirasatya96}
      # MinIO Object Storage Connection
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_REGION=us-east-1
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-change_me_minio_password}
      - MINIO_PUBLIC_URL=http://localhost:9000
      - BUCKET_AVATARS=wirasatya-avatars
      - BUCKET_POSTS=wirasatya-posts
      - BUCKET_DOCUMENTS=wirasatya-documents
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wirasatya-net

  # ============================================================================
  # 3. DATABASE: PostgreSQL 16 Relational Engine
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: wirasatya96-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change_me_db_password}
      - POSTGRES_DB=${DB_NAME:-wirasatya96}
    volumes:
      - ./data_aplikasi/postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./data_aplikasi/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wirasatya96"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wirasatya-net

  # ============================================================================
  # 4. STORAGE: MinIO S3-Compatible High-Speed Object Storage
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: wirasatya96-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API Port
      - "9001:9001"   # Web Console Port
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-change_me_minio_password}
    volumes:
      - ./data_aplikasi/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wirasatya-net

  # ============================================================================
  # 5. MINIO INIT: One-shot setup for buckets and download policies
  # ============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: wirasatya96-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-change_me_minio_password};
      /usr/bin/mc mb --ignore-existing localminio/wirasatya-avatars;
      /usr/bin/mc mb --ignore-existing localminio/wirasatya-posts;
      /usr/bin/mc mb --ignore-existing localminio/wirasatya-documents;
      /usr/bin/mc anonymous set download localminio/wirasatya-avatars;
      /usr/bin/mc anonymous set download localminio/wirasatya-posts;
      /usr/bin/mc anonymous set none localminio/wirasatya-documents;
      echo 'MinIO Buckets initialized successfully!';
      exit 0;
      "
    networks:
      - wirasatya-net

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  wirasatya-net:
    driver: bridge
